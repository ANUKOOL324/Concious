# Render Blueprint — deploy Concious backend
# https://dashboard.render.com → New → Blueprint
services:
  - type: web
    name: concious-backend
    runtime: node
    plan: free
    rootDir: concious_backend
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGO_URI
        sync: false
      - key: JWT_PASSWORD
        sync: false
      - key: HF_API_KEY
        sync: false
      - key: HF_EMBEDDING_MODEL
        value: intfloat/e5-small-v2
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_MODEL
        value: mistralai/mistral-small-3.1-24b-instruct
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
